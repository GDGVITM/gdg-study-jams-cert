<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification | GDG JIST</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Animation Layer -->
    <div class="animation-container">
        <div class="bar bar-yellow"></div>
        <div class="bar bar-red"></div>
        <div class="bar bar-blue"></div>
        <div class="bar bar-green"></div>
    </div>

    <div class="card input-page">
        <div class="header">
            
            <img src="Images/gdgvit_logo.png" alt="GDG Logo" class="logo" />
            
            <div class="social-media">
                <a href="https://www.twitter.com/gdgvit" target="_blank">
                    <img src="Images/x.svg" alt="GDG Twitter" class="social-media-logo" />
                </a>
                <a href="https://www.linkedin.com/company/google-developer-groups-vit-mumbai" target="_blank">
                    <img src="Images/linkedin.png" alt="GDG LinkedIn" class="social-media-logo" />
                </a>
                <a href="https://www.instagram.com/gdg_vit/" target="_blank">
                    <img src="Images/instagram.svg" alt="GDG Instagram" class="social-media-logo" />
                </a>
                <a href="https://linktr.ee/gdgvit" target="_blank">
                    <img src="Images/external_link.png" alt="GDG Linktree" class="social-media-logo" />
                </a>
                <a href="https://gdg.community.dev/gdg-on-campus-vidyalankar-institute-of-technology-mumbai-india/" target="_blank">
                    <img src="Images/website.png" alt="GDG Community website" class="social-media-logo" />
                </a>
            </div>
        </div>
        
        <div class="form-container">
            <h1>Certificate Verification</h1>
            <p>Enter the unique ID found on your certificate to verify its authenticity.</p>
            
            <form id="verify-form" class="input-group">
                <input type="text" id="cert-id-input" placeholder="e.g., GDG-25-XXXX" required>
                <button type="submit" id="verify-btn">Verify Credential</button>
            </form>

            <div class="mock-toggle">
                <span>Live Mode</span>
                <label class="switch">
                    <input type="checkbox" id="mock-mode-toggle">
                    <span class="slider"></span>
                </label>
                <span>Mock Mode</span>
            </div>
        </div>
    </div>

    <div class="footer-credits">
        Designed & Developed by Google Developers Group VIT
    </div>

<script>
    const verifyForm = document.getElementById('verify-form');
    const idInput = document.getElementById('cert-id-input');
    const mockToggle = document.getElementById('mock-mode-toggle');

    verifyForm.addEventListener('submit', function(event) {
        event.preventDefault();

        if (mockToggle.checked) {
            // --- MOCK MODE IS ON ---
            window.location.href = `verify.html?id=GDGJIST-25-587C`;
        } else {
            // --- LIVE MODE IS ON ---
            const certId = idInput.value.trim();
            if (certId) {
                window.location.href = `verify.html?id=${encodeURIComponent(certId)}`;
            } else {
                alert("Please enter a Certificate ID.");
            }
        }
    });
</script>

</body>
</html>
